name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Parse / job suites
        run: pnpm test:parse
        env:
          # Keep suites offline: memory keyring, no live reindex / Voyage / Ollama.
          INSTAGRAM_SAVES_KEYRING: memory
          EMBEDDING_WORKER_INLINE: "1"

      - name: Bench smoke (RSS gate)
        run: pnpm bench:smoke

      - name: Bench scale smoke (R3)
        run: pnpm bench:scale

      - name: Soak scale smoke (R3)
        run: pnpm soak:scale
        env:
          INSTAGRAM_SAVES_KEYRING: memory
          EMBEDDING_WORKER_INLINE: "1"

      - name: Build
        run: pnpm build
        env:
          INSTAGRAM_SAVES_KEYRING: memory
          EMBEDDING_WORKER_INLINE: "1"

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit / component (Vitest)
        run: pnpm test:unit

  contracts-pg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: instagram_saves
          POSTGRES_USER: instagram_saves
          POSTGRES_PASSWORD: instagram_saves_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U instagram_saves -d instagram_saves"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Postgres storage contracts
        run: pnpm test:pg
        env:
          CI: "true"
          INSTAGRAM_SAVES_DATABASE_URL: postgres://instagram_saves:instagram_saves_dev@127.0.0.1:5432/instagram_saves
          INSTAGRAM_SAVES_KEYRING: memory
          EMBEDDING_WORKER_INLINE: "1"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm test:e2e
        env:
          # Offline / no live embedding providers during smoke.
          INSTAGRAM_SAVES_KEYRING: memory
          EMBEDDING_WORKER_INLINE: "1"
          CI: "true"
