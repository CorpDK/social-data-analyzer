name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Parse / job suites
        run: pnpm test:parse
        env:
          # Keep suites offline: memory keyring, no live reindex / Voyage / Ollama.
          INSTAGRAM_SAVES_KEYRING: memory
          EMBEDDING_WORKER_INLINE: "1"

      - name: Bench smoke (RSS gate)
        run: pnpm bench:smoke

      - name: Build
        run: pnpm build
        env:
          INSTAGRAM_SAVES_KEYRING: memory
          EMBEDDING_WORKER_INLINE: "1"

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Unit / component (Vitest)
        run: pnpm test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke
        run: pnpm test:e2e
        env:
          # Offline / no live embedding providers during smoke.
          INSTAGRAM_SAVES_KEYRING: memory
          EMBEDDING_WORKER_INLINE: "1"
          CI: "true"
